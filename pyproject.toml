[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pypet"
description = "A tiny virtual pet that lives in your terminal."
version = "0.1.0"
authors = [
  { name = "Alexander Xie", email = "alexxie9667@gmail.com" },
]
license = { file = "LICENSE" }
readme = "README.md"
keywords = ["virtual pet", "terminal", "game", "python"]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
"Homepage" = "https://github.com/swe-students-fall2025/3-python-package-team_pioneer"
"Repository" = "https://github.com/swe-students-fall2025/3-python-package-team_pioneer.git"
"Bug Tracker" = "https://github.com/swe-students-fall2025/3-python-package-team_pioneer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
